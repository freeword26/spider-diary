[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spider-diary"
version = "1.0.0"
description = "Daily operations report generation engine with project tracking and reminder system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Spider Diary Team"}
]
keywords = ["project-management", "reporting", "kanban", "system-monitoring", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "psutil>=5.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
spider-diary = "spider_diary.cli.main:main"

[project.urls]
Homepage = "https://github.com/freeword26/spider-diary"
Repository = "https://github.com/freeword26/spider-diary.git"

# Flat package layout — packages are in the root directory
[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["core", "core.*", "report", "report.*", "storage", "storage.*", "remind", "remind.*", "cli", "cli.*", "scripts", "scripts.*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
